                    <input type="file" accept={accept} onChange={onChange} style={{ display: 'none' }} />
                  </label>
                ))}

                <div style={{ marginTop: 8 }}>
                  <div style={{ fontSize: 9, fontFamily: 'monospace', textTransform: 'uppercase', opacity: 0.5, marginBottom: 2 }}>Output Filename</div>
                  <input
                    type="text" value={filename} onChange={e => setFilename(e.target.value)}
                    placeholder="annotated_trace"
                    style={{ width: '100%', border: '1px solid rgba(20,20,20,0.3)', background: 'transparent', padding: '4px 6px', fontSize: 10, fontFamily: 'monospace', boxSizing: 'border-box' }}
                  />
                </div>

                <button
                  onClick={handleProcess}
                  disabled={!rawFile || !faultsFile || !qualityFile || status === 'processing'}
                  style={{
                    marginTop: 10, width: '100%', padding: '6px 0',
                    border: '1px solid #141414', background: 'transparent',
                    fontSize: 9, fontFamily: 'monospace', textTransform: 'uppercase', letterSpacing: '0.15em',
                    cursor: (!rawFile || !faultsFile || !qualityFile || status === 'processing') ? 'not-allowed' : 'pointer',
                    opacity: (!rawFile || !faultsFile || !qualityFile || status === 'processing') ? 0.4 : 1,
                  }}
                >
                  {status === 'processing' ? 'Processing…' : 'Export PDF'}
                </button>
                {error && <div style={{ fontSize: 9, color: '#c00', marginTop: 6, fontFamily: 'monospace' }}>{error}</div>}
              </div>
              <div style={{ border: '1px solid rgba(20,20,20,0.2)', padding: 10 }}>
                <div style={{ fontSize: 9, fontFamily: 'monospace', textTransform: 'uppercase', opacity: 0.5, marginBottom: 8 }}>Zoom</div>
                <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
                  <button onClick={() => setPixelsPerYard(p => Math.max(0.02, p * 0.7))}
                    style={{ flex: 1, border: '1px solid #141414', background: 'transparent', padding: '4px 0', fontSize: 11, cursor: 'pointer' }}>−</button>
                  <span style={{ fontSize: 9, fontFamily: 'monospace', opacity: 0.6, flex: 1, textAlign: 'center' }}>{(pixelsPerYard * 1760).toFixed(0)}px/mi</span>
                  <button onClick={() => setPixelsPerYard(p => Math.min(5, p * 1.4))}
                    style={{ flex: 1, border: '1px solid #141414', background: 'transparent', padding: '4px 0', fontSize: 11, cursor: 'pointer' }}>+</button>
                </div>
                <div style={{ fontSize: 8, fontFamily: 'monospace', opacity: 0.4, marginTop: 4 }}>Ctrl+scroll to zoom</div>
              </div>
              <div style={{ border: '1px solid rgba(20,20,20,0.2)', padding: 10 }}>
                <div style={{ fontSize: 9, fontFamily: 'monospace', textTransform: 'uppercase', opacity: 0.5, marginBottom: 8 }}>Channels (zoom = divisions visible)</div>
                {CHANNELS.map(ch => (
                  <div key={ch.key} style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 4 }}>
                    <button type="button" onClick={() => toggleChannelVisibility(ch.key)}
                      style={{ display: 'flex', alignItems: 'center', flexShrink: 0, background: 'transparent', border: 'none', cursor: 'pointer', padding: 0 }}>
                      <span style={{
                        display: 'inline-flex', width: 28, height: 16, borderRadius: 8, flexShrink: 0,
                        background: channelVisibility[ch.key] ? '#141414' : 'rgba(20,20,20,0.2)',
                        position: 'relative', transition: 'background 0.2s',
                      }}>
                        <span style={{
                          position: 'absolute', top: 2, left: channelVisibility[ch.key] ? 14 : 2,
                          width: 12, height: 12, borderRadius: 6, background: 'white', transition: 'left 0.2s',
                        }} />
                      </span>
                    </button>
                    <span style={{ fontSize: 9, fontFamily: 'monospace', opacity: 0.7, flex: 1 }}>{ch.label}</span>
                    <input
                      type="number" value={channelScales[ch.key]} min="0.1" step="1"
                      onChange={e => handleScaleChange(ch.key, e.target.value)}
                      style={{ width: 40, border: '1px solid rgba(20,20,20,0.3)', background: 'transparent', padding: '1px 3px', fontSize: 9, fontFamily: 'monospace', textAlign: 'right' }}
                    />
                  </div>
                ))}
              </div>
              <div style={{ border: '1px solid rgba(20,20,20,0.2)', padding: 10 }}>
                <div style={{ fontSize: 9, fontFamily: 'monospace', textTransform: 'uppercase', opacity: 0.5, marginBottom: 8 }}>Savgol Filter</div>
                {SAVGOL_CHANNELS.map(key => (
                  <div key={key} style={{ marginBottom: 6 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 2 }}>
                      <button type="button" onClick={() => setSavgolEnabled(prev => ({...prev, [key]: !prev[key]}))}
                        style={{ display: 'flex', alignItems: 'center', background: 'transparent', border: 'none', cursor: 'pointer', padding: 0 }}>
                        <span style={{
                          display: 'inline-flex', width: 28, height: 16, borderRadius: 8,
                          background: savgolEnabled[key] ? '#141414' : 'rgba(20,20,20,0.2)',
                          position: 'relative', transition: 'background 0.2s',
                        }}>
                          <span style={{
                            position: 'absolute', top: 2, left: savgolEnabled[key] ? 14 : 2,
                            width: 12, height: 12, borderRadius: 6, background: 'white', transition: 'left 0.2s',
                          }} />
                        </span>
                      </button>
                      <span style={{ fontSize: 9, fontFamily: 'monospace', opacity: 0.8 }}>{key}</span>
                    </div>
                    {savgolEnabled[key] && (
                      <div style={{ paddingLeft: 34 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 3 }}>
                          <span style={{ fontSize: 8, fontFamily: 'monospace', opacity: 0.5 }}>window</span>
                          <input type="number" min="5" step="2" value={savgolWindow[key]}
                            onChange={e => { const v = parseInt(e.target.value); if (v >= 5) setSavgolWindow(prev => ({...prev, [key]: v})); }}
                            style={{ width: 50, border: '1px solid rgba(20,20,20,0.3)', background: 'transparent', padding: '1px 3px', fontSize: 9, fontFamily: 'monospace' }}
                          />
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                          <button type="button" onClick={() => setSavgolShowRaw(prev => ({...prev, [key]: !prev[key]}))}
                            style={{ display: 'flex', alignItems: 'center', background: 'transparent', border: 'none', cursor: 'pointer', padding: 0 }}>
                            <span style={{
                              display: 'inline-flex', width: 22, height: 13, borderRadius: 6,
                              background: savgolShowRaw[key] ? '#141414' : 'rgba(20,20,20,0.2)',
                              position: 'relative', transition: 'background 0.2s', flexShrink: 0,
                            }}>
                              <span style={{
                                position: 'absolute', top: 1.5, left: savgolShowRaw[key] ? 11 : 1.5,
                                width: 10, height: 10, borderRadius: 5, background: 'white', transition: 'left 0.2s',
                              }} />
                            </span>
                          </button>
                          <span style={{ fontSize: 8, fontFamily: 'monospace', opacity: 0.5 }}>show raw</span>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>

              <div style={{ border: '1px solid rgba(20,20,20,0.2)', padding: 10 }}>
                <div style={{ fontSize: 9, fontFamily: 'monospace', textTransform: 'uppercase', opacity: 0.5, marginBottom: 8 }}>Annotation Layers</div>
                {[
                  { key: 'faults',       label: 'Current Faults'  },
                  { key: 'quality',      label: 'Track Quality'    },
                  { key: 'sc',           label: 'S&C Locations'    },
                  { key: 'otm',          label: 'OTM Plan'         },
                  { key: 'underbridges', label: 'Underbridges'     },
                  { key: 'overbridges',  label: 'Overbridges'      },
                  { key: 'culverts',     label: 'Culverts'         },
                  { key: 'trackcat',     label: 'Track Cat'        },
                ].map(({ key, label }) => (
                  <button key={key} type="button" onClick={() => toggleItem(key)}
                    style={{ display: 'flex', alignItems: 'center', gap: 8, width: '100%', background: 'transparent', border: 'none', cursor: 'pointer', padding: '3px 0', color: '#141414' }}
                  >
                    <span style={{
                      display: 'inline-flex', flexShrink: 0, width: 32, height: 18, borderRadius: 9,
                      background: toggles[key] ? '#141414' : 'rgba(20,20,20,0.2)', position: 'relative', transition: 'background 0.2s',
                    }}>
                      <span style={{
                        position: 'absolute', top: 2, left: toggles[key] ? 16 : 2,
                        width: 14, height: 14, borderRadius: 7, background: 'white', transition: 'left 0.2s',
                      }} />
                    </span>
                    <span style={{ fontSize: 9, fontFamily: 'monospace', textTransform: 'uppercase', letterSpacing: '0.1em' }}>{label}</span>
                  </button>
                ))}
                <div style={{ marginTop: 8, paddingTop: 8, borderTop: '1px solid rgba(20,20,20,0.1)' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                    <span style={{ fontSize: 9, fontFamily: 'monospace', textTransform: 'uppercase', opacity: 0.5, letterSpacing: '0.1em' }}>OTM Range</span>
                    <span style={{ fontSize: 9, fontFamily: 'monospace', fontWeight: 'bold' }}>±{otmWeeks}w</span>
                  </div>
                  <input type="range" min={1} max={52} value={otmWeeks}
                    onChange={e => setOtmWeeks(parseInt(e.target.value))}
                    style={{ width: '100%', accentColor: '#141414', cursor: 'pointer' }}
                  />
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ fontSize: 8, fontFamily: 'monospace', opacity: 0.4 }}>1w</span>
                    <span style={{ fontSize: 8, fontFamily: 'monospace', opacity: 0.4 }}>52w</span>
                  </div>
                </div>
              </div>

              <div style={{ padding: '16px 0', borderBottom: '1px solid rgba(20,20,20,0.1)' }}>
                <div style={{ fontSize: 9, fontFamily: 'monospace', textTransform: 'uppercase', opacity: 0.5, marginBottom: 8 }}>Fault Limits</div>
                {[
                  { key: 'twist',      label: 'Twist (3m)'  },
                  { key: 'tightGauge', label: 'Tight Gauge' },
                  { key: 'wideGauge',  label: 'Wide Gauge'  },
                  { key: 'top',        label: 'Top'         },
                  { key: 'line',       label: 'Line'        }
                ].map(({ key, label }) => {
                  const isOpen = faultDropdownsOpen[key];
                  const masterOn = faultLimitToggles[key].master;
                  return (
                    <div key={key} style={{ marginBottom: 4 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                        <button type="button" onClick={() => setFaultDropdownsOpen(p => ({ ...p, [key]: !p[key] }))}
                          style={{ background: 'transparent', border: 'none', cursor: 'pointer', padding: '2px 4px', fontSize: 10, color: '#141414', fontFamily: 'monospace', lineHeight: 1 }}>
                          {isOpen ? '▼' : '▶'}
                        </button>
                        <button type="button" onClick={() => toggleFaultMaster(key)}
                          style={{ display: 'flex', alignItems: 'center', gap: 8, flex: 1, background: 'transparent', border: 'none', cursor: 'pointer', padding: '3px 0', color: '#141414' }}>
                          <span style={{
                            display: 'inline-flex', flexShrink: 0, width: 32, height: 18, borderRadius: 9,
                            background: masterOn ? '#141414' : 'rgba(20,20,20,0.2)', position: 'relative', transition: 'background 0.2s',
                          }}>
                            <span style={{
                              position: 'absolute', top: 2, left: masterOn ? 16 : 2,
                              width: 14, height: 14, borderRadius: 7, background: 'white', transition: 'left 0.2s',
                            }} />
                          </span>
                          <span style={{ fontSize: 9, fontFamily: 'monospace', textTransform: 'uppercase', letterSpacing: '0.1em' }}>{label}</span>
                        </button>
                      </div>
                      {isOpen && (
                        <div style={{ paddingLeft: 16, marginTop: 4 }}>
                          {FAULT_LIMITS[key].groups.map(g => {
                            const on = faultLimitToggles[key][g.id];
                            const dotColor = g.kind === 'IAL' ? '#ff3333' : '#ff9900';
                            return (
                              <button key={g.id} type="button" onClick={() => toggleFaultGroup(key, g.id)}
                                style={{ display: 'flex', alignItems: 'center', gap: 6, width: '100%', background: 'transparent', border: 'none', cursor: 'pointer', padding: '2px 0', color: '#141414' }}>
                                <span style={{
                                  display: 'inline-block', width: 10, height: 10, borderRadius: 2,
                                  background: on ? dotColor : 'transparent',
                                  border: '1px solid ' + dotColor
                                }} />
                                <span style={{ fontSize: 8, fontFamily: 'monospace', letterSpacing: '0.05em', opacity: on ? 1 : 0.6 }}>{g.label}</span>
                              </button>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }} ref={containerRef}>
              {!traceData ? (
                <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', opacity: 0.4 }}>
                  <div style={{ textAlign: 'center' }}>
                    <div style={{ fontSize: 32, marginBottom: 8 }}>📈</div>
                    <div style={{ fontSize: 11, fontFamily: 'monospace', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Load a raw data CSV to begin</div>
                  </div>
                </div>
              ) : (
                <React.Fragment>
                <div style={{ position: 'sticky', top: 0, zIndex: 30, background: '#E4E3E0', borderBottom: '1px solid rgba(20,20,20,0.2)', display: 'flex' }}>
                  <div style={{ width: LABEL_WIDTH, flexShrink: 0, background: '#E4E3E0', borderRight: '1px solid rgba(20,20,20,0.2)' }} />
                  <div style={{ flex: 1, overflow: 'hidden' }}>
                    <MileageRuler
                      points={traceData.points}
                      pixelsPerYard={pixelsPerYard}
                      scrollLeft={scrollLeft}
                      viewWidth={viewWidth}
                    />
                  </div>
                </div>
                <div
                ref={scrollRef}
                onScroll={(e) => setScrollLeft(e.target.scrollLeft)}
                onWheel={handleWheel}
                onMouseMove={handleMouseMove}
                onMouseLeave={handleMouseLeave}
                style={{ overflowX: 'scroll', overflowY: 'visible' }}
              >
                <div style={{ width: rawTraceWidth + LABEL_WIDTH, minWidth: '100%' }}>
                  {CHANNELS.filter(ch => channelVisibility[ch.key]).map(ch => (
                    <div key={ch.key}>
                      <div style={{ display: 'flex', alignItems: 'stretch' }}>
                        <div style={{
                          width: LABEL_WIDTH, flexShrink: 0,
                          position: 'sticky', left: 0, zIndex: 10,
                          borderRight: '1px solid rgba(20,20,20,0.2)',
                          display: 'flex', flexDirection: 'column', justifyContent: 'center',
                          padding: '2px 8px', background: '#E4E3E0', height: channelHeights[ch.key]
                        }}>
                          <div style={{ fontSize: 9, fontWeight: 'bold', fontFamily: 'monospace' }}>{ch.label}</div>
                          <div style={{ fontSize: 8, opacity: 0.5, fontFamily: 'monospace' }}>±{ch.divSize}mm/div</div>
                        </div>
                        <div style={{ position: 'sticky', left: LABEL_WIDTH, zIndex: 5 }}>
                          <ChannelCanvas
                            channel={ch}
                            points={traceData.points}
                            height={channelHeights[ch.key]}
                            pixelsPerYard={pixelsPerYard}
                            scrollLeft={scrollLeft}
                            viewWidth={viewWidth}
                            scale={channelScales[ch.key]}
                            divSize={ch.divSize}
                            savgolData={savgolDataMap[ch.key] || null}
                            savgolShowRaw={savgolShowRaw[ch.key] !== false}
                            activeLimits={activeLimitsForChannel(ch.key)}
                            trackCat={assetsData.trackCat || []}
                            faults={[
                              ...(toggles.faults  ? faultsData.map(f => ({...f, _type:'fault'}))   : []),
                              ...(toggles.quality ? qualityData.map(f => ({...f, _type:'quality'})) : []),
                            ]}
                          />
                        </div>
                      </div>
                      <div
                        className="resize-handle"
                        onMouseDown={(e) => startResize(ch.key, e)}
                        title="Drag to resize channel"
                      />
                    </div>
                  ))}

                  {traceData.points.length > 0 && ANNOTATION_CHANNELS.filter(ach => {
                    const anyOn = ach.key === 'structures'
                      ? (toggles.underbridges || toggles.overbridges || toggles.culverts)
                      : toggles[ach.key];
                    return anyOn;
                  }).map(ach => {
                    const surveyDate = traceData.meta && traceData.meta.date
                      ? (() => { const p = traceData.meta.date.split('/'); return new Date(p[2]+'-'+p[1]+'-'+p[0]); })()
                      : null;
                    // Filter structures by toggle
                    const filteredAssets = ach.key === 'structures' ? {
                      ...assetsData,
                      structures: (assetsData.structures || []).filter(s => {
                        const isUB = s.assetType === 'Underbridge';
                        const isOB = s.assetType === 'Overbridge' || s.assetType === 'Footbridge';
                        const isUC = s.assetType === 'Underline Culvert';
                        return (isUB && toggles.underbridges) || (isOB && toggles.overbridges) || (isUC && toggles.culverts);
                      })
                    } : assetsData;
                    return (
                      <div key={ach.key} style={{ minWidth: rawTraceWidth + LABEL_WIDTH }}>
                        <div style={{ display: 'flex', alignItems: 'stretch' }}>
                          <div style={{
                            width: LABEL_WIDTH, flexShrink: 0,
                            position: 'sticky', left: 0, zIndex: 10,
                            borderRight: '1px solid rgba(20,20,20,0.2)',
                            borderTop: '2px solid ' + ach.color,
                            display: 'flex', flexDirection: 'column', justifyContent: 'center',
                            padding: '2px 8px', background: '#E4E3E0', height: ach.height
                          }}>
                            <div style={{ fontSize: 9, fontWeight: 'bold', fontFamily: 'monospace', color: ach.color }}>{ach.label}</div>
                          </div>
                          <div style={{ position: 'sticky', left: LABEL_WIDTH, zIndex: 5, borderTop: '2px solid ' + ach.color, overflow: 'hidden' }}>
                            <AnnotationCanvas
                              channelKey={ach.key}
                              assets={filteredAssets}
                              height={ach.height}
                              pixelsPerYard={pixelsPerYard}
                              scrollLeft={scrollLeft}
                              viewWidth={viewWidth}
                              traceMinAbs={traceData.points[0].absYards}
                              surveyDate={surveyDate}
                              otmWeeks={otmWeeks}
                            />
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
                </React.Fragment>
              )}
            </div>
          </div>
        <HoverTooltip info={hoverInfo} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
